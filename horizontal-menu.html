<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu dropdown ngang</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }

    #menu {
      min-height: 40px;
      border: 1px solid #222;
      background-color: #222;
    }

    #menu ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #menu > ul {
      display: flex;
    }

    #menu li {
      position: relative;
    }

    #menu a {
      display: block;
      width: 160px;
      height: 40px;
      padding: 0 16px;
      color: #fff;
      line-height: 40px;
      text-decoration: none;
      white-space: nowrap;
    }

    #menu a:hover,
    #menu li:focus-within > a {
      background-color: #d62828;
    }

    #menu ul ul {
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 1;
      visibility: hidden;
      background-color: #222;
    }

    #menu li:hover > ul,
    #menu li:focus-within > ul {
      visibility: visible;
    }

    #menu a:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -3px;
    }
  </style>
</head>
<body>
  <h1>Menu dropdown ngang</h1>
  <nav id="menu" aria-label="Menu chính">
    <ul>
      <li><a href="#trang-chu">Trang chủ</a></li>
      <li>
        <a href="#san-pham">Sản phẩm</a>
        <ul>
          <li><a href="#may-tinh">Máy tính</a></li>
          <li><a href="#dien-thoai">Điện thoại</a></li>
          <li><a href="#phu-kien">Phụ kiện</a></li>
        </ul>
      </li>
      <li>
        <a href="#tin-tuc">Tin tức</a>
        <ul>
          <li><a href="#cong-nghe">Công nghệ</a></li>
          <li><a href="#khuyen-mai">Khuyến mãi</a></li>
        </ul>
      </li>
      <li><a href="#lien-he">Liên hệ</a></li>
    </ul>
  </nav>
</body>
</html>
